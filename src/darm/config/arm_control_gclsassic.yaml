controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_effort_controller:
      type: effort_controllers/JointGroupEffortController

arm_effort_controller:
  ros__parameters:
    joints:
      - L1_to_L2
      - L2_to_L3
      - L3_to_L4
    command_interfaces:
      - effort
    state_interfaces:
      - effort
      - position
      - velocity
