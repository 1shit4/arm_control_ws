controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    yaw_effort_controller:
      type: effort_controllers/JointGroupEffortController

    shoulder_effort_controller:
      type: effort_controllers/JointGroupEffortController
    
    elbow_effort_controller:
      type: effort_controllers/JointGroupEffortController
    jaw_effort_controller:
      type: effort_controllers/JointGroupEffortController

yaw_effort_controller:
  ros__parameters:
    joints:
      - arm_to_L1
    command_interfaces:
      - effort
    state_interfaces:
      - effort
      - position
      - velocity

    state_publish_rate: 100.0

shoulder_effort_controller:
  ros__parameters:
    joints:
      - L1_to_L2
    command_interfaces:
      - effort
    state_interfaces:
      - effort
      - position
      - velocity

    state_publish_rate: 100.0

elbow_effort_controller:
  ros__parameters:
    joints:
      - L2_to_L3
    command_interfaces:
      - effort
    state_interfaces:
      - position  
      - velocity

    state_publish_rate: 100.0

jaw_effort_controller:
  ros__parameters:
    joints:
      - L3_to_L4
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0 
