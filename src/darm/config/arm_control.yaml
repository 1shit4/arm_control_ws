controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    yaw_effort_controller:
      type: effort_controllers/JointGroupEffortController

    pitch_effort_controller:
      type: effort_controllers/JointGroupEffortController

yaw_effort_controller:
  ros__parameters:
    joints:
      - arm_rev
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0


pitch_effort_controller:
  ros__parameters:
    joints:
      - claw1_rev
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0